[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pretzel-dashboard-backend"
version = "2.0.0"
description = "Internal dashboard API for the Pretzel ecosystem"
authors = [
    {name = "Pretzel Team"}
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
start-backend = "app.main:app"
dev-server = "dev_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-dir]
"" = "."

[tool.uvicorn]
app = "app.main:app"
host = "0.0.0.0"
port = 8000